<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takax - Project Details</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-cyan: #58a6ff;
            --accent-orange: #d29922;
            --accent-red: #f85149;
            --border-color: #30363d;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        
        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }
        
        .logo-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }
        
        .project-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .project-meta {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .project-actions {
            display: flex;
            gap: 1rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--bg-secondary);
            border-color: var(--text-secondary);
        }
        
        .btn-primary {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2ea043;
            border-color: #2ea043;
        }
        
        /* Cards */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Status Badge */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .status-created {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-cyan);
        }
        
        .status-building {
            background: rgba(210, 153, 34, 0.15);
            color: var(--accent-orange);
        }
        
        .status-completed {
            background: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
        }
        
        .status-failed {
            background: rgba(248, 81, 73, 0.15);
            color: var(--accent-red);
        }
        
        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .info-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .info-value {
            font-size: 1rem;
            font-weight: 500;
        }
        
        /* Config */
        .config-section {
            margin-top: 1rem;
        }
        
        .config-item {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .config-item:last-child {
            border-bottom: none;
        }
        
        .config-key {
            color: var(--text-secondary);
        }
        
        .config-value {
            font-family: 'Courier New', monospace;
            color: var(--accent-cyan);
        }
        
        /* Build History */
        .build-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .build-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .build-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .build-id {
            font-family: 'Courier New', monospace;
            color: var(--accent-cyan);
        }
        
        .build-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        
        /* Terminal */
        .terminal-box {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow: auto;
            white-space: pre-wrap;
            color: #0f0;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">
            <div class="logo-icon">T</div>
            <span class="logo-text">Takax</span>
        </a>
        <nav>
            <a href="/" class="btn">← Back to Chat</a>
        </nav>
    </header>
    
    <div class="container">
        <div class="project-header">
            <div>
                <h1 class="project-title" id="projectName">Project Loading...</h1>
                <div class="project-meta">
                    Created: <span id="projectDate">-</span>
                </div>
            </div>
            <div class="project-actions">
                <button class="btn" onclick="editProject()">✏️ Edit</button>
                <button class="btn btn-primary" onclick="newBuild()">🔨 New Build</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">
                Status
                <span class="status status-created" id="projectStatus">Created</span>
            </div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Project ID</span>
                    <span class="info-value" id="projectId">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Distribution</span>
                    <span class="info-value" id="projectDistro">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Last Build</span>
                    <span class="info-value" id="lastBuild">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Total Builds</span>
                    <span class="info-value" id="totalBuilds">0</span>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📋 Configuration</div>
            <div class="config-section" id="configSection">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>No configuration yet</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📜 Build History</div>
            <div class="build-list" id="buildList">
                <div class="empty-state">
                    <div class="empty-icon">🔨</div>
                    <p>No builds yet</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-title">📟 Latest Build Output</div>
            <div class="terminal-box" id="terminalOutput">
                Waiting for build output...
            </div>
        </div>
    </div>
    
    <script>
        // Get project ID from URL
        const projectId = window.location.pathname.split('/').pop();
        
        // Fetch project data
        async function loadProject() {
            try {
                const response = await fetch(`/api/projects/${projectId}`);
                if (!response.ok) throw new Error('Project not found');
                
                const project = await response.json();
                
                document.getElementById('projectName').textContent = project.name;
                document.getElementById('projectDate').textContent = new Date(project.created_at).toLocaleString();
                document.getElementById('projectId').textContent = project.id;
                document.getElementById('projectStatus').textContent = project.status;
                
            } catch (error) {
                console.error('Error loading project:', error);
            }
        }
        
        // Load builds
        async function loadBuilds() {
            try {
                const response = await fetch('/api/builds');
                const builds = await response.json();
                
                const projectBuilds = builds.filter(b => b.project_id === projectId);
                
                document.getElementById('totalBuilds').textContent = projectBuilds.length;
                
                if (projectBuilds.length > 0) {
                    const lastBuild = projectBuilds[0];
                    document.getElementById('lastBuild').textContent = new Date(lastBuild.created_at).toLocaleString();
                    
                    const buildList = document.getElementById('buildList');
                    buildList.innerHTML = projectBuilds.map(build => `
                        <div class="build-item">
                            <div class="build-info">
                                <span class="build-id">#${build.id}</span>
                                <span class="build-time">${new Date(build.created_at).toLocaleString()}</span>
                            </div>
                            <span class="status status-${build.status}">${build.status}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading builds:', error);
            }
        }
        
        function editProject() {
            alert('Edit functionality coming soon!');
        }
        
        function newBuild() {
            window.location.href = '/';
        }
        
        // Initialize
        loadProject();
        loadBuilds();
    </script>
</body>
</html>
